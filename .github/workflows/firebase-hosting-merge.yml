# Deploys to the live Firebase Hosting channel on every push to main.
# Uses the existing service-account secret — no local auth needed.
name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MYPORTFOLIO_4391B }}'
          channelId: live
          projectId: myportfolio-4391b
