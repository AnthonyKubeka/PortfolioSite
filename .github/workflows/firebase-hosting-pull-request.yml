name: Deploy to Firebase Hosting on PR
'on': pull_request
permissions:
  contents: read
jobs:
  release_lookup:
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    runs-on: ubuntu-latest
    steps:
      - name: Print masked release users
        env:
          SA_KEY: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MYPORTFOLIO_4391B }}'
        run: |
          umask 077
          printf '%s' "$SA_KEY" > "$RUNNER_TEMP/key.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/key.json" --quiet > /dev/null 2>&1
          export TOK="$(gcloud auth print-access-token)"
          echo "::add-mask::$TOK"
          python3 - <<'PY'
          import json, os, re, urllib.request, urllib.error
          tok = os.environ["TOK"]
          def get(u):
              r = urllib.request.Request(u, headers={"Authorization": "Bearer " + tok})
              try:
                  return json.load(urllib.request.urlopen(r))
              except urllib.error.HTTPError as e:
                  print("HTTP", e.code, u.split("/v1beta1/")[1][:60]); return {}
          def mask(a):
              return re.sub(r"^(.{3})[^@]*@", r"\1***@", a or "")
          base = "https://firebasehosting.googleapis.com/v1beta1/"
          sites = get(base + "projects/myportfolio-4391b/sites")
          for s in sites.get("sites", []):
              print("SITE", s["name"].split("/")[-1], s.get("type"))
          seen = {}
          tokp = ""
          n = 0
          while True:
              d = get(base + "sites/myportfolio-4391b/releases?pageSize=100" + ("&pageToken=" + tokp if tokp else ""))
              for r in d.get("releases", []):
                  n += 1
                  e = r.get("releaseUser", {}).get("email", "")
                  k = (mask(e), len(e.split("@")[0]))
                  t = r.get("releaseTime", "")[:10]
                  lo, hi, c = seen.get(k, (t, t, 0))
                  seen[k] = (min(lo, t), max(hi, t), c + 1)
              tokp = d.get("nextPageToken", "")
              if not tokp:
                  break
          print("RELEASES", n)
          for (m, ln), (lo, hi, c) in seen.items():
              print("USER", m, "local-part-length", ln, "count", c, "first", lo, "last", hi)
          d = get(base + "sites/myportfolio-4391b/domains")
          for x in d.get("domains", []):
              print("DOMAIN", x.get("domainName"), x.get("status"))
          PY
          rm -f "$RUNNER_TEMP/key.json"
