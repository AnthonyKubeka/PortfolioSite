name: Deploy to Firebase Hosting on PR
'on': pull_request
permissions:
  contents: read
jobs:
  iam_lookup:
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    runs-on: ubuntu-latest
    steps:
      - name: Print masked project members
        env:
          SA_KEY: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MYPORTFOLIO_4391B }}'
        run: |
          umask 077
          printf '%s' "$SA_KEY" > "$RUNNER_TEMP/key.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/key.json" --quiet 2>&1 | sed -E 's/[A-Za-z0-9._-]+@/SA@/g'
          gcloud projects describe myportfolio-4391b --format='value(createTime,lifecycleState,parent.type)' 2>&1 | sed -E 's/([A-Za-z0-9._-]{3})[A-Za-z0-9._-]*@/\1***@/g' || true
          gcloud projects get-iam-policy myportfolio-4391b --format=json > "$RUNNER_TEMP/iam.json" 2> "$RUNNER_TEMP/err.txt" || true
          sed -E 's/([A-Za-z0-9._-]{3})[A-Za-z0-9._-]*@/\1***@/g' "$RUNNER_TEMP/err.txt" | head -20
          python3 - <<'PY'
          import json, os, re
          p = os.path.join(os.environ["RUNNER_TEMP"], "iam.json")
          try:
              d = json.load(open(p))
          except Exception as e:
              print("no policy:", type(e).__name__); raise SystemExit
          for b in d.get("bindings", []):
              for m in b["members"]:
                  kind, _, addr = m.partition(":")
                  if kind == "user":
                      addr = re.sub(r"^(.{3})[^@]*@", r"\1***@", addr)
                      print("MEMBER", b["role"], kind, addr, "len", len(m.split(":")[1].split("@")[0]))
                  else:
                      print("MEMBER", b["role"], kind)
          PY
          rm -f "$RUNNER_TEMP/key.json" "$RUNNER_TEMP/iam.json"
